# Core scientific-library versions recorded in the historical environment.
# This installs dependencies; install the package with pip after activation.
name: sinabro
channels:
  - conda-forge
dependencies:
  - python=3.9.15
  - numpy=1.21.6
  - biopython=1.79
  - scipy=1.8.1
  - pip
  - setuptools>=59.6
  - wheel
