name: Package tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[analysis]"
      - run: python -m unittest discover -s tests -v
      - run: sinabro --input examples/cdsplus.fa --output smoke.csv --signatures SBS2 SBS13 --n-trajectories 5 --seed 42
  recorded-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install numpy==1.21.6 biopython==1.79 scipy==1.8.1
      - run: python -m pip install ".[analysis]"
      - run: python -m unittest discover -s tests -v
      - run: sinabro --input examples/cdsplus.fa --output smoke.csv --signatures SBS2 SBS13 --n-trajectories 5 --seed 42
