[metadata]
name = sinabro
version = attr: sinabro.__version__
description = Sequential coding-sequence mutations with explicit neutrality criteria
long_description = file: README.md
long_description_content_type = text/markdown
author = Joon-Hyun Song
license = BSD-3-Clause
license_files = LICENSE
url = https://github.com/StudyingAnt/sinabro

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.21,<3
    biopython>=1.79,<2
include_package_data = True

[options.packages.find]
include =
    sinabro
    sinabro.*

[options.package_data]
sinabro = data/*.txt

[options.entry_points]
console_scripts =
    sinabro = sinabro.cli:main

[options.extras_require]
analysis = scipy>=1.7
